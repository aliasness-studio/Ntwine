name: release
# A pushed `v*` tag builds a Developer ID signed + notarized universal macOS zip and an unsigned
# Windows Squirrel installer, then publishes both as a GitHub Release. docs/RELEASING.md is the
# runbook; the secrets named below are configured in the repository settings, never in this file.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

# Keyed on the tag: a re-push of the same tag queues behind the running release instead of racing
# it to `gh release create` (the second create then fails on the existing release).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      # Stock runner Node is enough: the script imports only `node:` builtins. It prints one
      # `prerelease=true|false` line, or exits 1 when the tag doesn't match package.json.
      - id: tag
        run: |
          line=$(node scripts/checkTagVersion.mjs "$GITHUB_REF_NAME")
          echo "$line"
          echo "$line" >> "$GITHUB_OUTPUT"

  mac:
    needs: guard
    runs-on: macos-latest
    # Notarization alone took ~37 min on the first run.
    timeout-minutes: 120
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Host Node runs yarn/Forge/Vite only; app + tests run under Electron's Node. 24 (not 22)
          # because better-sqlite3 v13's install runs an (always-no-op, prebuilds ship in the
          # tarball) `node-gyp rebuild`, and gyp configure on Windows still has to FIND Visual
          # Studio: windows-latest now carries VS 2026 ("18"), which the node-gyp bundled with
          # Node 22's npm can't parse (`unknown version "undefined"` → install fails). Node 24's
          # npm bundles a node-gyp that understands VS 2026.
          node-version: 24
          cache: yarn
      # Throwaway keychain holding only the Developer ID cert; deleted in the always() step below.
      - name: Import signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/ntwine-signing.keychain-db"
          P12="$RUNNER_TEMP/ntwine-signing.p12"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          trap 'rm -f "$P12"' EXIT
          KC_PW=$(uuidgen)
          echo "::add-mask::$KC_PW"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          security import "$P12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
      - run: yarn --frozen-lockfile
      # scripts/signing.mjs reads exactly these four; an identity with incomplete notarization
      # credentials throws at config load rather than shipping an un-notarized build.
      - name: Build, sign and notarize
        env:
          NTWINE_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: yarn make:mac
      # docs/RELEASING.md "Verify before shipping".
      - name: Verify signature, notarization and architectures
        run: |
          codesign --verify --deep --strict --verbose=2 out/Ntwine-darwin-universal/Ntwine.app
          spctl --assess --type execute -vv out/Ntwine-darwin-universal/Ntwine.app
          xcrun stapler validate out/Ntwine-darwin-universal/Ntwine.app
          archs=$(lipo -archs out/Ntwine-darwin-universal/Ntwine.app/Contents/MacOS/Ntwine)
          echo "$archs"
          [ "$archs" = "x86_64 arm64" ]
      - name: Packaged boot probe
        run: NTWINE_PACKAGED_DIR=$PWD/out/Ntwine-darwin-universal yarn e2e:only --grep packaged
      # The runner is Apple silicon, so the probe above only exercised the arm64 slice. Boot the
      # x86_64 slice under Rosetta; the first launch can exceed 30 s while Rosetta translates.
      - name: Intel-slice boot probe
        run: |
          arch -x86_64 /usr/bin/true || softwareupdate --install-rosetta --agree-to-license
          log="$RUNNER_TEMP/intel-probe.log"
          arch -x86_64 out/Ntwine-darwin-universal/Ntwine.app/Contents/MacOS/Ntwine > "$log" 2>&1 &
          pid=$!
          sleep 60
          if ! kill -0 "$pid" 2>/dev/null; then
            code=0
            wait "$pid" || code=$?
            echo "::error::x86_64 slice exited within 60 s (exit code $code)"
            cat "$log"
            exit 1
          fi
          kill "$pid"
          wait "$pid" || true
          echo "x86_64 slice still running after 60 s"
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: out/make/zip/darwin/universal/*.zip
          if-no-files-found: error
      - name: Delete signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi

  win:
    needs: guard
    runs-on: windows-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24, not 22: see the mac job — windows-latest's VS 2026 needs Node 24's node-gyp.
          node-version: 24
          cache: yarn
      - run: yarn --frozen-lockfile
      # Unsigned: this pipeline signs macOS only.
      - run: yarn make:win
      # Setup.exe, RELEASES and the full .nupkg.
      - uses: actions/upload-artifact@v7
        with:
          name: win
          path: out/make/squirrel.windows/x64/*
          if-no-files-found: error

  publish:
    needs: [guard, mac, win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mac
          path: dist/mac
      - uses: actions/download-artifact@v7
        with:
          name: win
          path: dist/win
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        run: |
          major="${GITHUB_REF_NAME#v}"
          major="${major%%.*}"
          title="Ntwine $GITHUB_REF_NAME"
          if [ "$major" -lt 1 ]; then title="$title (beta)"; fi
          prerelease=()
          if [ "$PRERELEASE" = true ]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$title" --generate-notes \
            "${prerelease[@]}" dist/mac/*.zip dist/win/*
