name: ci
# All four gates (e2e, unit tests, typecheck, lint) on macOS and Windows, for every pull request
# and every push to main. Needs no secrets, so it is safe to run for pull requests from forks.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request or branch supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Host Node runs yarn/Forge/Vite only; app + tests run under Electron's Node. 24 (not 22)
          # because better-sqlite3 v13's install runs an (always-no-op, prebuilds ship in the
          # tarball) `node-gyp rebuild`, and gyp configure on Windows still has to FIND Visual
          # Studio: windows-latest now carries VS 2026 ("18"), which the node-gyp bundled with
          # Node 22's npm can't parse (`unknown version "undefined"` → install fails). Node 24's
          # npm bundles a node-gyp that understands VS 2026.
          node-version: 24
          cache: yarn
      - run: yarn --frozen-lockfile
      # ORDER IS LOAD-BEARING: `yarn e2e` runs `electron-forge package`, whose rebuild puts
      # better-sqlite3 on Electron's ABI; `yarn test` (Vitest under Electron's Node) fails
      # on the ABI mismatch if it runs before that.
      - run: yarn e2e
      - run: yarn test
      - run: yarn typecheck
      - run: yarn lint
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
