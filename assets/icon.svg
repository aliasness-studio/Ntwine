<!--
  AliasNess mark: a triangle wave that reads as A, a square wave that reads as N. Ntwine ships
  under the studio's mark as its intro product.

  THE SOURCE OF TRUTH for every app icon. `yarn icons` (scripts/build-icons.mjs) rasterizes this
  file to icon.ico's 48px-and-up frames and to icon.png; the committed binaries are generated, this
  is the file to edit. Sizes 32 and below come from icon-small.svg instead — two thin glyphs side
  by side turn to mush at 16px, so the small frames get their own, blunter drawing.

  Geometry is deliberately plain integers on a 256 grid: the marks span x 30..226 and y 72..184,
  split into two 86-wide glyphs with a 24 gutter. Anyone re-proportioning this can do it by reading
  the numbers rather than by reverse-engineering a curve.

  The A is a TRIANGLE wave, not the sawtooth of the original mockup. A sawtooth's vertical fall
  sits flush against the next ramp, so two cycles render as a capital M — measured, not guessed: a
  side-by-side render of four sawtooth interpretations all read M. A triangle wave's rise-and-fall
  IS the letter's two legs, and the crossbar is just the waveform's own baseline, so the glyph
  reads as both a wave and an A at once.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" rx="56" fill="#2A2E37" />
  <g fill="none" stroke-width="13" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- Triangle wave "A": ramp up to the peak, ramp back down. -->
    <path d="M30 184 L73 72 L116 184" stroke="#8B5CF6" />
    <!-- ...and its baseline, which doubles as the A's crossbar. -->
    <path d="M52 137 L94 137" stroke="#8B5CF6" />
    <!-- Square wave "N": rise, run, fall, run, rise. -->
    <path d="M140 184 L140 72 L183 72 L183 184 L226 184 L226 72" stroke="#F7B32B" />
  </g>
</svg>
